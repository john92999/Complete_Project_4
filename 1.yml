- name: "trying"
  hosts: all
  become: true
  tasks:
    - name: install Java
      ansible.builtin.apt:
        name: openjdk-11-jdk
        state: present
        update_cache: true

    - name: Install curl
      ansible.builtin.apt:
        name: curl
        state: present

    - name: Remove old MongoDB repo files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/apt/sources.list.d/mongodb-org-6.0.list
        - /etc/apt/sources.list.d/mongodb-org-7.0.list
        - /etc/apt/sources.list.d/mongodb-org-8.0.list

    - name: Remove old MongoDB GPG keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/mongodb-server-8.0.gpg
        state: absent

    - name: Add MongoDB GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg

    - name: Add MongoDB 8.0 APT repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse"
        state: present
        filename: mongodb-org-8.0

    - name: Install MongoDB
      ansible.builtin.apt:
        name: mongodb-org
        state: present
        update_cache: true
      notify: start and enable MongoDB

    - name: Flushing handler so MongoDB is started now
      ansible.builtin.meta: flush_handlers

    - name: Remove old NodeSource GPG keyring
      ansible.builtin.file:
        path: /usr/share/keyrings/nodesource.gpg
        state: absent

    - name: Add NodeSource GPG key
      ansible.builtin.shell:
        cmd: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg

    - name: Add NodeSource Node.js 20 repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
        state: present
        filename: nodesource-node20

    - name: install nodejs package
      ansible.builtin.apt:
        name: nodejs
        state: present
        update_cache: true

  handlers:
    - name: start and enable MongoDB
      ansible.builtin.systemd:
        name: mongod
        state: started
        enabled: true
